# Local development stack: API (FrankenPHP), queue worker, scheduler, PostgreSQL.
# Usage is documented in README.md ("Run locally on Windows").
name: stockflow

x-php: &php
    build:
        context: .
    image: stockflow-api:local
    volumes:
        # Source code is bind-mounted for live editing; vendor/ stays inside the
        # container (populated from the image) so the host does not need PHP.
        - ./:/app
        - /app/vendor
    environment:
        # Real environment variables take precedence over .env in Laravel.
        DB_HOST: postgres
        DB_PORT: "5432"
    depends_on:
        postgres:
            condition: service_healthy

services:
    app:
        <<: *php
        ports:
            - "${FORWARD_APP_PORT:-8000}:8000"
        # Replaces the image's default check (Caddy admin port) with Laravel's
        # health route, so "healthy" means the application actually boots.
        healthcheck:
            test: ["CMD", "curl", "-fsS", "http://localhost:8000/up"]
            interval: 10s
            timeout: 5s
            retries: 12
            start_period: 10s
        restart: unless-stopped

    queue:
        <<: *php
        command: ["php", "artisan", "queue:work", "--tries=3", "--backoff=10", "--sleep=1", "--max-time=3600"]
        # No web server runs here, so the image's HTTP health check does not apply.
        healthcheck:
            disable: true
        restart: unless-stopped

    scheduler:
        <<: *php
        command: ["php", "artisan", "schedule:work"]
        healthcheck:
            disable: true
        restart: unless-stopped

    postgres:
        image: postgres:18-alpine
        environment:
            POSTGRES_DB: ${DB_DATABASE:-stockflow}
            POSTGRES_USER: ${DB_USERNAME:-stockflow}
            POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
        ports:
            - "${FORWARD_DB_PORT:-5432}:5432"
        volumes:
            # PostgreSQL 18 images keep data under /var/lib/postgresql/<major>/.
            - pgdata:/var/lib/postgresql
            - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
            interval: 5s
            timeout: 5s
            retries: 12
        restart: unless-stopped

volumes:
    pgdata:
