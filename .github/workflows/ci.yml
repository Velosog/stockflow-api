name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: "8.4"
  PHP_EXTENSIONS: pdo_pgsql, intl, zip

jobs:
  quality:
    name: quality (composer, pint, phpstan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
          tools: composer:v2

      - name: Validate composer.json and composer.lock
        run: composer validate --strict

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install dependencies (from lockfile)
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Audit dependencies for known vulnerabilities
        run: composer audit

      - name: Code style (Pint)
        run: vendor/bin/pint --test

      - name: Static analysis (PHPStan / Larastan)
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

  tests:
    name: tests (pest + postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: stockflow_testing
          POSTGRES_USER: stockflow
          POSTGRES_PASSWORD: stockflow-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stockflow -d stockflow_testing"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: stockflow_testing
      DB_USERNAME: stockflow
      DB_PASSWORD: stockflow-ci
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
          tools: composer:v2

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install dependencies (from lockfile)
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction

      - name: Run test suite
        run: vendor/bin/pest

  docker:
    name: docker (compose smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Prepare .env
        run: |
          cp .env.example .env
          sed -i 's/^DB_PASSWORD=.*/DB_PASSWORD=ci-only-password/' .env

      - name: Build images
        run: docker compose build

      - name: Generate application key
        run: docker compose run --rm --no-deps app php artisan key:generate --force --no-interaction

      - name: Start stack
        run: docker compose up -d --wait

      - name: Migrate and seed
        run: docker compose exec -T app php artisan migrate --seed --force --no-interaction

      - name: Smoke test
        run: |
          curl --fail --silent --show-error --retry 10 --retry-delay 3 --retry-all-errors http://localhost:8000/up
          curl --fail --silent --show-error \
            -H 'Accept: application/json' -H 'Content-Type: application/json' \
            -d '{"email":"admin@stockflow.test","password":"password","device_name":"ci"}' \
            http://localhost:8000/api/v1/auth/login > /dev/null
          echo "API is up and login works"

      - name: Container logs
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v

  secrets-scan:
    runs-on: ubuntu-latest
    env:
      # Keep in sync with the rev in .pre-commit-config.yaml
      GITLEAKS_VERSION: 8.30.1
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks (checksum-verified)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$tarball" "$base/$tarball"
          curl -sSfL -o checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${tarball}\$" checksums.txt | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
          rm -f "$tarball" checksums.txt gitleaks

      - name: Scan full git history
        run: gitleaks git --verbose --redact
